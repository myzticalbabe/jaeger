name: Bug report
description: Report something that does not work as documented
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A minimal reproduction gets a fix much faster than a
        description of symptoms.

        Jaeger is a library: if you are filing a **security** vulnerability rather
        than a bug, do not use this form — report it privately as described in
        [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Paste the full error output, not a paraphrase.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: ledger
    attributes:
      label: Ledger file contents, if the bug involves reading a ledger back
      description: |
        Paste the JSONL lines that trigger the problem. Replace real content with
        placeholder values — the lines are one JSON object per line.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. krampus-jaeger 0.1.0, or commit 4be46b1
  - type: input
    id: environment
    attributes:
      label: Operating system and runtime
      description: jaeger requires Python 3.13 or newer.
      placeholder: e.g. Windows 11, Python 3.13.14
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for the same problem
          required: true
        - label: This is not a security vulnerability (those are reported privately per SECURITY.md)
          required: true
